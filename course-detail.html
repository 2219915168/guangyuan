<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FBF8FF">
  <title>课程详情 · 光源宇宙</title>
  <meta name="description" content="光源宇宙课程详情：课程介绍、适合人群、学习收获、导师、形式与报名流程。">
  <link rel="stylesheet" href="styles.css">
  <script src="i18n.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main id="main">
    <section class="page-hero">
      <h1 class="page-title">课程详情</h1>
      <p class="page-sub">示例：西塔基础疗愈课</p>
    </section>

    <section class="section-tight">
      <div class="wrap page-body">
        <div class="panel"><h3>课程介绍</h3><p>学习能量清理，建立清晰与方向感。</p></div>
        <div class="grid-2">
          <div class="panel"><h3>适合人群</h3><p>适合自己的节奏，开展内在探索。</p></div>
          <div class="panel"><h3>学习收获</h3><p>建立觉察，带回日常可练习的方法。</p></div>
        </div>
        <div class="panel"><h3>导师</h3><p>主理老师：小蝴蝶。</p></div>
        <div class="panel"><h3>形式与时间说明</h3><p>线上 / 线下 · 具体排期请咨询小蝴蝶。</p></div>
        <div class="panel"><h3>报名流程</h3><p>咨询 → 确认适合度 → 填写预约前问卷 → 确认时间。</p></div>
        <div class="panel"><h3>常见问题</h3><p>费用与排期请通过页面下方联系方式咨询，本站不展示价格与库存。</p></div>
        <div class="panel"><h3>免责提示</h3><p>课程属于个人成长支持，不替代医疗诊断与治疗。</p></div>

        <div class="cta-banner" style="margin-top:30px">
          <img class="cta-banner-bg" src="assets/images/cta-dreamscape.png" alt="" aria-hidden="true" width="1920" height="826">
          <div class="cta-copy">
            <h2 class="cta-title">想了解这门课程？</h2>
            <p class="cta-desc">联系小蝴蝶，获取课程建议与预约安排。</p>
          </div>
          <div class="cta-action">
            <a class="btn btn-primary btn-arrow" href="contact.html">咨询 / 预约</a>
            <a class="btn btn-ghost" href="courses.html">返回课程</a>
          </div>
        </div>
      </div>
    </section>
  </main>
